<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impactos - Prevenção ao Suicídio</title>
    <link rel="stylesheet" href="style.css">
    <script src="interacoes.js" defer> </script>
</head>
<body>


<!-- ABA LATERAL DO RELATO FICTÍCIO -->
<button type="button" id="abrir-relato"
        aria-expanded="false"
        aria-controls="painel-relato">
    Relato fictício
</button>

<aside id="painel-relato" hidden>
    <button type="button" id="fechar-relato">
        Fechar ✕
    </button>

    <h2>Registrar relato fictício</h2>

    <p>
        Use somente situações inventadas.
        Nenhum dado será enviado ou armazenado.
    </p>

    <form id="form-relato" novalidate>
        <div class="campo">
            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria" required>
                <option value="">Selecione</option>
                <option value="convivencia">Convivência</option>
                <option value="ambiente-digital">Ambiente digital</option>
                <option value="valorizacao-da-vida">Valorização da vida</option>
            </select>
        </div>

        <div class="campo">
            <label for="descricao">Situação fictícia:</label>
            <textarea id="descricao" name="descricao"
                      rows="5" maxlength="1000" required></textarea>
        </div>

        <div class="campo">
            <label for="sugestao-relato">Sugestão (opcional):</label>
            <textarea id="sugestao-relato" name="sugestao"
                      rows="3" maxlength="500"></textarea>
        </div>

        <button type="submit" class="botao-enviar">
            Conferir relato
        </button>

        <p id="resultado-relato" role="status"
           aria-live="polite"></p>
    </form>

<button type="button" id="abrir-relato">

</button>

</aside>


</aside>
</body>
</html>
