<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Prevenção ao Suicídio</title>
    <link rel="stylesheet" href="style.css">
    <script src="interacoes.js" defer> </script>
</head>

<body>

    <!-- TÍTULO PRINCIPAL -->
    <h1>FALE CONOSCO</h1>

    <!-- MENU DE NAVEGAÇÃO -->
    <nav>
        <ul>
            <a href="index.html">Principal</a>
            <a href="problema.html">Problemas</a>
            <a href="combate.html">Combate</a>
            <a href="impactos.html">Impactos</a>
            <a href="contato.html">Contato</a>
            <a href="fontes.html">Fontes</a>
        </ul>
    </nav>
      
    <main>
        <h2>Envie sua Mensagem</h2>
        <p>Preencha os campos abaixo para entrar em contato conosco ou tirar dúvidas sobre o projeto.</p>

        <!-- ESTRUTURA DO FORMULÁRIO -->
        <form action="#" method="POST" class="formulario-contato">
            
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com" required>
            </div>

            <div class="campo">
                <label for="mensagem">Sua Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Como podemos te ajudar?" required></textarea>
            </div>

            <button type="submit" class="botao-enviar">Enviar Mensagem</button>

        </form>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>Projeto escolar sobre prevenção ao suicídio e valorização da vida.</p>
    </footer>

</body>
</html>
